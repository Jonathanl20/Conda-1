<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Word para PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        .upload-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }
        .custom-file-upload {
            border: 2px dashed #0d6efd;
            border-radius: 5px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .custom-file-upload:hover {
            background-color: #f8f9fa;
        }
        #file-name {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1 class="text-center mb-4">Conversor Word para PDF</h1>
        <form action="/convert" method="post" enctype="multipart/form-data" id="upload-form">
            <div class="custom-file-upload" id="drop-zone">
                <div class="upload-icon">📄</div>
                <h5>Arraste seu arquivo Word aqui</h5>
                <p class="text-muted">ou</p>
                <input type="file" name="file" id="file-input" class="d-none" accept=".docx">
                <button type="button" class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                    Selecionar Arquivo
                </button>
                <div id="file-name"></div>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3" id="convert-btn" disabled>
                Converter para PDF
            </button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const convertBtn = document.getElementById('convert-btn');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', function(e) {
            if (this.files[0]) {
                fileName.textContent = this.files[0].name;
                convertBtn.disabled = false;
            }
        });

        // Drag and drop functionality
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#198754';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0d6efd';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#0d6efd';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileName.textContent = files[0].name;
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
